<!DOCTYPE html>
<html>

<head>

    <title>Contact</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <h2>Portfolio</h2>

    <div>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/projects">Projects</a>
        <a href="/contact">Contact</a>
    </div>

</nav>

<section class="contact-section">

    <div class="contact-card">

        <h1>Contact Me</h1>

        <form method="POST">

            <input
            type="text"
            name="name"
            placeholder="Enter Your Name"
            required>

            <input
            type="email"
            name="email"
            placeholder="Enter Your Email"
            required>

            <textarea
            name="message"
            placeholder="Enter Your Message"
            rows="6"
            required></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</section>

</body>

</html>
